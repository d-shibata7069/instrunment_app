name: Flutter CI

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install Flutter stable
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - name: Resolve and format
        run: |
          flutter pub get
          dart format lib test
          git diff --exit-code -- pubspec.lock lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
