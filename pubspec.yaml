name: instrunment_app
description: "A separate-device instrument display for WASA FEE telemetry."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  flutter_map_animations: ^0.6.0
  provider: ^6.1.2
  flutter_hooks: ^0.21.2
  hooks_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
